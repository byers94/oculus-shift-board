<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oculus Shift Admin Portal</title>
    <style>
        :root {
            --primary-bg: #f3f4f6;
            --card-bg: #ffffff;
            --oculus-blue: #1e3a8a;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --gray: #6b7280;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: var(--primary-bg); margin: 0; padding: 0; color: #1f2937; }
        header { background-color: var(--oculus-blue); color: white; padding: 16px; text-align: center; font-size: 20px; font-weight: bold; }
        .container { max-width: 800px; margin: 20px auto; padding: 0 15px; }
        
        /* Form Sections */
        .admin-section { background: var(--card-bg); border-radius: 8px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); border-top: 4px solid var(--oculus-blue); }
        .admin-section h2 { margin-top: 0; font-size: 18px; color: var(--oculus-blue); border-bottom: 1px solid #e5e7eb; padding-bottom: 10px; }
        
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 13px; font-weight: bold; color: #555; margin-bottom: 5px; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 14px; }
        .form-group input[readonly] { background-color: #f8fafc; color: #334155; font-weight: 600; cursor: not-allowed; }
        
        .btn { padding: 12px 15px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; color: white; display: inline-block; width: 100%; text-align: center; font-size: 15px; }
        .btn-bulk { background-color: var(--warning); color: #fff; }
        .btn-bulk:hover { background-color: #d97706; }
        .btn-submit { background-color: var(--oculus-blue); }
        .btn-submit:hover { background-color: #172554; }
        
        /* Feed Sections */
        .shift-item { border: 1px solid #e5e7eb; border-radius: 6px; padding: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; background: #fff; }
        .shift-info { flex: 2; }
        .shift-info h4 { margin: 0 0 5px 0; font-size: 16px; }
        .shift-info p { margin: 0; font-size: 13px; color: var(--gray); }
        
        .shift-actions { flex: 1; text-align: right; display: flex; gap: 8px; justify-content: flex-end; }
        .btn-small { padding: 6px 12px; border: none; border-radius: 4px; font-size: 12px; font-weight: bold; cursor: pointer; color: white; }
        .btn-fill { background-color: var(--success); }
        .btn-fill:hover { background-color: #059669; }
        .btn-delete { background-color: var(--danger); }
        .btn-delete:hover { background-color: #dc2626; }
    </style>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>

    <header>Oculus Ops Control Panel</header>

    <div class="container">
        
        <!-- 1. BULK IMPORT (TOP) -->
        <div class="admin-section" style="border-top-color: var(--warning);">
            <h2 style="color: #d97706;">⚡ Mass / Bulk Import Shifts</h2>
            <p style="font-size:13px; color:#666; margin-top:-5px;">Paste your formatted JSON block here to import multiple shifts at once.</p>
            <div class="form-group">
                <textarea id="bulk-json" rows="6" placeholder='[ { "site": "The Forge Security", "date": "Mon 17 Aug 2026", "time": "21:00 - 05:00", "hours": "8 Hours", "urgency": "Standard" } ]'></textarea>
            </div>
            <button class="btn btn-bulk" onclick="bulkImport()">Upload Bulk Shifts</button>
        </div>

        <!-- 2. POST SINGLE SHIFT (MIDDLE) -->
        <div class="admin-section">
            <h2>Post Single Open Shift</h2>
            <form id="add-shift-form" onsubmit="addSingleShift(event)">
                <div class="form-group">
                    <label>Site Name</label>
                    <input type="text" id="site" required placeholder="e.g. Mint Urban Infinity">
                </div>
                
                <div class="form-group">
                    <label>Shift Date</label>
                    <input type="date" id="shiftDate" required>
                </div>

                <div style="display: flex; gap: 10px;">
                    <div class="form-group" style="flex: 1;">
                        <label>Start Time</label>
                        <select id="startTime" required onchange="calculateHours()">
                            <option value="" disabled selected>Select Start...</option>
                            <option value="00:00">00:00 (12:00 AM)</option>
                            <option value="01:00">01:00 (1:00 AM)</option>
                            <option value="02:00">02:00 (2:00 AM)</option>
                            <option value="03:00">03:00 (3:00 AM)</option>
                            <option value="04:00">04:00 (4:00 AM)</option>
                            <option value="05:00">05:00 (5:00 AM)</option>
                            <option value="06:00">06:00 (6:00 AM)</option>
                            <option value="07:00">07:00 (7:00 AM)</option>
                            <option value="08:00">08:00 (8:00 AM)</option>
                            <option value="09:00">09:00 (9:00 AM)</option>
                            <option value="10:00">10:00 (10:00 AM)</option>
                            <option value="11:00">11:00 (11:00 AM)</option>
                            <option value="12:00">12:00 (12:00 PM)</option>
                            <option value="13:00">13:00 (1:00 PM)</option>
                            <option value="14:00">14:00 (2:00 PM)</option>
                            <option value="15:00">15:00 (3:00 PM)</option>
                            <option value="16:00">16:00 (4:00 PM)</option>
                            <option value="17:00">17:00 (5:00 PM)</option>
                            <option value="18:00">18:00 (6:00 PM)</option>
                            <option value="19:00">19:00 (7:00 PM)</option>
                            <option value="20:00">20:00 (8:00 PM)</option>
                            <option value="21:00">21:00 (9:00 PM)</option>
                            <option value="22:00">22:00 (10:00 PM)</option>
                            <option value="23:00">23:00 (11:00 PM)</option>
                        </select>
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>End Time</label>
                        <select id="endTime" required onchange="calculateHours()">
                            <option value="" disabled selected>Select End...</option>
                            <option value="00:00">00:00 (12:00 AM)</option>
                            <option value="01:00">01:00 (1:00 AM)</option>
                            <option value="02:00">02:00 (2:00 AM)</option>
                            <option value="03:00">03:00 (3:00 AM)</option>
                            <option value="04:00">04:00 (4:00 AM)</option>
                            <option value="05:00">05:00 (5:00 AM)</option>
                            <option value="06:00">06:00 (6:00 AM)</option>
                            <option value="07:00">07:00 (7:00 AM)</option>
                            <option value="08:00">08:00 (8:00 AM)</option>
                            <option value="09:00">09:00 (9:00 AM)</option>
                            <option value="10:00">10:00 (10:00 AM)</option>
                            <option value="11:00">11:00 (11:00 AM)</option>
                            <option value="12:00">12:00 (12:00 PM)</option>
                            <option value="13:00">13:00 (1:00 PM)</option>
                            <option value="14:00">14:00 (2:00 PM)</option>
                            <option value="15:00">15:00 (3:00 PM)</option>
                            <option value="16:00">16:00 (4:00 PM)</option>
                            <option value="17:00">17:00 (5:00 PM)</option>
                            <option value="18:00">18:00 (6:00 PM)</option>
                            <option value="19:00">19:00 (7:00 PM)</option>
                            <option value="20:00">20:00 (8:00 PM)</option>
                            <option value="21:00">21:00 (9:00 PM)</option>
                            <option value="22:00">22:00 (10:00 PM)</option>
                            <option value="23:00">23:00 (11:00 PM)</option>
                        </select>
                    </div>
                </div>

                <div style="display: flex; gap: 10px;">
                    <div class="form-group" style="flex: 1;">
                        <label>Total Hours (Auto-Calculated)</label>
                        <input type="text" id="hours" readonly placeholder="Select times above...">
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>Urgency / Status</label>
                        <select id="urgency" required>
                            <option value="Standard">Standard</option>
                            <option value="Emergency">Emergency</option>
                            <option value="Call-Off">Call-Off</option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="btn btn-submit">+ Post Shift to Live Board</button>
            </form>
        </div>

        <!-- 3. LIVE SHIFT MANAGEMENT (BOTTOM) -->
        <div class="admin-section">
            <h2>Live Active Shifts</h2>
            <div id="admin-feed">
                <p style="text-align:center; color:#666;">Loading shifts...</p>
            </div>
        </div>

    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyD-SxQG5H-gD5UbwbG-PEzu6buAuOFbKSw",
            authDomain: "oculus-opne-shift-board.firebaseapp.com",
            projectId: "oculus-opne-shift-board",
            storageBucket: "oculus-opne-shift-board.firebasestorage.app",
            messagingSenderId: "282551856349",
            appId: "1:282551856349:web:981dcb99fa0a3762353f34"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Auto-Calculate Total Hours (handles overnight math)
        function calculateHours() {
            const start = document.getElementById('startTime').value;
            const end = document.getElementById('endTime').value;
            
            if (!start || !end) return;

            const [startH, startM] = start.split(':').map(Number);
            const [endH, endM] = end.split(':').map(Number);

            let diffMinutes = (endH * 60 + endM) - (startH * 60 + startM);
            if (diffMinutes <= 0) {
                // Overnight shift calculation
                diffMinutes += 24 * 60;
            }

            const totalHours = diffMinutes / 60;
            document.getElementById('hours').value = `${totalHours} Hours`;
        }

        // 1. Bulk Import Function
        async function bulkImport() {
            const jsonText = document.getElementById('bulk-json').value.trim();
            if(!jsonText) return alert("Please paste the JSON block first.");
            
            try {
                const shifts = JSON.parse(jsonText);
                let count = 0;
                
                for (const s of shifts) {
                    const startTimeStr = s.time.split('-')[0].trim();
                    const dateParts = s.date.split(' '); // "Mon 17 Aug 2026"
                    const dateOnly = `${dateParts[1]} ${dateParts[2]} ${dateParts[3]}`;
                    const startIso = new Date(`${dateOnly} ${startTimeStr}`).toISOString();

                    await db.collection("shifts").add({
                        site: s.site,
                        dateDisplay: s.date,
                        timeDisplay: s.time,
                        hours: s.hours,
                        urgency: s.urgency || "Standard",
                        startIso: startIso,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    count++;
                }
                alert(`Successfully imported ${count} shifts!`);
                document.getElementById('bulk-json').value = '';
            } catch (error) {
                alert("Error importing shifts. Please check the JSON formatting.\n" + error.message);
            }
        }

        // 2. Single Shift Add Function
        async function addSingleShift(e) {
            e.preventDefault();
            
            const rawDate = document.getElementById('shiftDate').value; // "2026-08-17"
            const [year, month, day] = rawDate.split('-');
            const dateObj = new Date(year, month - 1, day);

            // Format date display (e.g. "Mon 17 Aug 2026")
            const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
            const dateDisplay = `${days[dateObj.getDay()]} ${parseInt(day, 10)} ${months[dateObj.getMonth()]} ${year}`;

            const startTime = document.getElementById('startTime').value;
            const endTime = document.getElementById('endTime').value;
            const timeDisplay = `${startTime} - ${endTime}`;

            // Create ISO string for chronological feed sorting
            const startIso = new Date(`${day} ${months[dateObj.getMonth()]} ${year} ${startTime}`).toISOString();

            const shiftData = {
                site: document.getElementById('site').value,
                dateDisplay: dateDisplay,
                timeDisplay: timeDisplay,
                hours: document.getElementById('hours').value,
                urgency: document.getElementById('urgency').value,
                startIso: startIso,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            };

            await db.collection("shifts").add(shiftData);
            alert("Shift successfully posted to the live board!");
            document.getElementById('add-shift-form').reset();
            document.getElementById('hours').value = '';
        }

        // 3. Live Shifts Listener
        db.collection("shifts").orderBy("startIso", "asc").onSnapshot((snapshot) => {
            const feed = document.getElementById('admin-feed');
            feed.innerHTML = '';
            const now = new Date();
            let count = 0;

            snapshot.forEach((doc) => {
                const shift = doc.data();
                if (new Date(shift.startIso) <= now) return;

                count++;
                const isFilled = shift.urgency === "Filled";
                const bgStyle = isFilled ? "background-color: #f9fafb; opacity: 0.7;" : "";

                feed.innerHTML += `
                    <div class="shift-item" style="${bgStyle}">
                        <div class="shift-info">
                            <h4>${shift.site}</h4>
                            <p>${shift.dateDisplay} | ${shift.timeDisplay} (${shift.hours}) | Status: <strong>${shift.urgency}</strong></p>
                        </div>
                        <div class="shift-actions">
                            ${!isFilled ? `<button class="btn-small btn-fill" onclick="markFilled('${doc.id}')">Mark Filled</button>` : ''}
                            <button class="btn-small btn-delete" onclick="deleteShift('${doc.id}')">Delete</button>
                        </div>
                    </div>
                `;
            });

            if (count === 0) {
                feed.innerHTML = '<p style="text-align:center; color:#666;">No active shifts currently on the board.</p>';
            }
        });

        async function markFilled(id) {
            if(confirm("Mark this shift as filled? It will grey out on the guard board.")) {
                await db.collection("shifts").doc(id).update({ urgency: "Filled" });
            }
        }

        async function deleteShift(id) {
            if(confirm("Permanently delete this shift from the board?")) {
                await db.collection("shifts").doc(id).delete();
            }
        }
    </script>
</body>
</html>
