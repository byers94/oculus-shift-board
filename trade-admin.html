<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ops Trade Approvals</title>
    <style>
        :root {
            --primary-bg: #f3f4f6;
            --card-bg: #ffffff;
            --oculus-blue: #1e3a8a;
            --success: #10b981;
            --danger: #ef4444;
            --gray: #6b7280;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: var(--primary-bg); margin: 0; padding: 0; color: #1f2937; }
        header { background-color: var(--oculus-blue); color: white; padding: 16px; text-align: center; font-size: 20px; font-weight: bold; }
        .container { max-width: 700px; margin: 20px auto; padding: 0 15px; }
        
        .approval-card { background: white; border-radius: 8px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); border-top: 4px solid #f59e0b; }
        .approval-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid #e5e7eb; padding-bottom: 10px; }
        .approval-header h3 { margin: 0; color: var(--oculus-blue); font-size: 18px; }
        .status-badge { background: #fef3c7; color: #d97706; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        
        .swap-container { display: flex; gap: 15px; margin-bottom: 20px; }
        .swap-box { flex: 1; background: #f8fafc; padding: 15px; border-radius: 6px; border: 1px solid #e2e8f0; }
        .swap-box h4 { margin: 0 0 10px 0; font-size: 14px; color: var(--gray); text-transform: uppercase; }
        .swap-detail { font-size: 14px; margin-bottom: 5px; line-height: 1.4; }
        .swap-detail strong { color: #333; }
        
        .action-buttons { display: flex; gap: 10px; }
        .btn { flex: 1; padding: 12px; border: none; border-radius: 6px; font-size: 14px; font-weight: bold; cursor: pointer; color: white; }
        .btn-approve { background-color: var(--success); }
        .btn-approve:hover { background-color: #059669; }
        .btn-deny { background-color: var(--danger); }
        .btn-deny:hover { background-color: #dc2626; }
    </style>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>

    <header>Ops Shift Swap Approvals</header>

    <div class="container" id="admin-feed">
        <p style="text-align:center; color:#666; margin-top:40px;">Scanning for pending swaps...</p>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyD-SxQG5H-gD5UbwbG-PEzu6buAuOFbKSw",
            authDomain: "oculus-opne-shift-board.firebaseapp.com",
            projectId: "oculus-opne-shift-board",
            storageBucket: "oculus-opne-shift-board.firebasestorage.app",
            messagingSenderId: "282551856349",
            appId: "1:282551856349:web:981dcb99fa0a3762353f34"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Listen for Trades that need Ops Approval
        db.collection("trades").where("status", "==", "Pending Ops Approval").onSnapshot((snapshot) => {
            const feed = document.getElementById('admin-feed');
            feed.innerHTML = '';

            if (snapshot.empty) {
                feed.innerHTML = '<p style="text-align:center; color:#666; margin-top:40px; font-size:16px;">No pending swaps require approval at this time.</p>';
                return;
            }

            snapshot.forEach((doc) => {
                const tr = doc.data();
                
                feed.innerHTML += `
                    <div class="approval-card">
                        <div class="approval-header">
                            <h3>Swap Request Review</h3>
                            <span class="status-badge">Action Required</span>
                        </div>
                        
                        <div class="swap-container">
                            <!-- Guard A Data -->
                            <div class="swap-box">
                                <h4>Officer ${tr.guardAName} gets:</h4>
                                <div class="swap-detail"><strong>Site:</strong> ${tr.siteB}</div>
                                <div class="swap-detail"><strong>Date:</strong> ${tr.dateB}</div>
                                <div class="swap-detail"><strong>Time:</strong> ${tr.timeB}</div>
                            </div>
                            
                            <!-- Guard B Data -->
                            <div class="swap-box">
                                <h4>Officer ${tr.guardBName} gets:</h4>
                                <div class="swap-detail"><strong>Site:</strong> ${tr.siteA}</div>
                                <div class="swap-detail"><strong>Date:</strong> ${tr.dateA}</div>
                                <div class="swap-detail"><strong>Time:</strong> ${tr.timeA}</div>
                                <div style="margin-top: 10px;">
                                    ${tr.trainingNeeded === 'Needs OJT' 
                                        ? '<span class="status-badge" style="background:#fee2e2; color:#dc2626;">🔴 OJT REQUIRED</span>' 
                                        : '<span class="status-badge" style="background:#dcfce3; color:#166534;">🟢 Previously Trained</span>'}
                                </div>
                            </div>
                        </div>

                        <div class="action-buttons">
                            <button class="btn btn-deny" onclick="denySwap('${doc.id}')">Deny & Reset</button>
                            <button class="btn btn-approve" onclick="approveSwap('${doc.id}')">Approve Swap</button>
                        </div>
                    </div>
                `;
            });
        });

        // Approve Function: Marks Trade as Official
        async function approveSwap(id) {
            if(confirm("Confirm this swap? Both guards will be officially reassigned.")) {
                await db.collection("trades").doc(id).update({ status: "Approved - Final" });
            }
        }

        // Deny Function: Kicks the original shift back to the Open Board and clears Guard B's offer
        async function denySwap(id) {
            const reason = prompt("Enter deny reason (e.g., Overtime, Missing Certs):");
            if (reason !== null) {
                await db.collection("trades").doc(id).update({
                    status: "Open",
                    guardBName: firebase.firestore.FieldValue.delete(),
                    siteB: firebase.firestore.FieldValue.delete(),
                    dateB: firebase.firestore.FieldValue.delete(),
                    timeB: firebase.firestore.FieldValue.delete(),
                    trainingNeeded: firebase.firestore.FieldValue.delete() // Clear training flag on deny
                });
                alert(`Swap denied. Officer A's shift has been placed back on the Open Trade Board.`);
            }
        }
    </script>
</body>
</html>
